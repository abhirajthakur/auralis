<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 512" role="img" aria-label="Auralis — Your voice, refined.">
  <defs>
    <linearGradient id="stroke" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDE9FE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g stroke="url(#stroke)" stroke-width="42" stroke-linecap="round" fill="none">
    <path d="M 176 122 L 76 392"/>
    <path d="M 176 122 L 276 392"/>
  </g>
  <g fill="url(#bars)">
    <rect x="122" y="282" width="13" height="40" rx="6.5"/>
    <rect x="149" y="266" width="13" height="72" rx="6.5"/>
    <rect x="176" y="248" width="13" height="108" rx="6.5"/>
    <rect x="203" y="266" width="13" height="72" rx="6.5"/>
    <rect x="230" y="282" width="13" height="40" rx="6.5"/>
  </g>

  <!-- Wordmark -->
  <text x="360" y="316" fill="#F4F2FA"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="196" font-weight="600" letter-spacing="2">auralis</text>
  <text x="366" y="392" fill="#A78BFA"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="40" font-weight="500" letter-spacing="14">YOUR VOICE, REFINED</text>
</svg>
